name: Deploy RATLLA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratlla-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pygbag and FFmpeg
        run: |
          python -m pip install pygbag==0.9.3
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Prepare web game
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ratlla"
          mkdir -p "$stage"
          test -s main.py
          cp main.py ratlla_*.py "$stage/"
          cp -R assets "$stage/"
          find "$stage" -type d -name __pycache__ -prune -exec rm -rf {} +
          while IFS= read -r -d '' file; do
            ffmpeg -nostdin -loglevel error -y -i "$file" -c:a libvorbis -q:a 5 "${file%.*}.ogg"
            rm "$file"
          done < <(find "$stage/assets" -type f -iname '*.wav' -print0)
          sed -i 's/\.wav/\.ogg/g' "$stage/ratlla_audio.py"
          python -m py_compile "$stage"/*.py
          find "$stage" -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Build with Pygbag
        run: |
          python -m pygbag --build --no_opt "$RUNNER_TEMP/ratlla"
          test -s "$RUNNER_TEMP/ratlla/build/web/index.html"
          touch "$RUNNER_TEMP/ratlla/build/web/.nojekyll"
      - name: Fit game to desktop and mobile screens
        shell: bash
        run: |
          python - "$RUNNER_TEMP/ratlla/build/web/index.html" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          html = path.read_text(encoding="utf-8")
          html, count = re.subn(r'<meta\s+name="viewport"[^>]*>', '', html, flags=re.I)
          assert count >= 1, "Missing Pygbag viewport"
          responsive = """
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style id="ratlla-responsive">
            html, body {
              width: 100%; height: 100%; margin: 0;
              overflow: hidden; overscroll-behavior: none;
              background: #101522 !important;
            }
            #canvas {
              position: fixed !important;
              top: 50% !important; left: 50% !important;
              bottom: auto !important; right: auto !important;
              transform: translate(-50%, -50%) !important;
              margin: 0 !important; border: 0 !important; padding: 0 !important;
              width: min(100vw, 177.777778vh) !important;
              height: min(100vh, 56.25vw) !important;
              width: min(100vw, 177.777778dvh) !important;
              height: min(100dvh, 56.25vw) !important;
              touch-action: none;
              user-select: none; -webkit-user-select: none;
            }
            #infobox {
              max-width: calc(100vw - 32px);
              box-sizing: border-box;
              text-align: center;
            }
            #ratlla-rotate {
              display: none;
              position: fixed;
              top: max(12px, env(safe-area-inset-top));
              left: 12px; right: 12px;
              color: #ddd;
              font: 14px/1.4 system-ui, sans-serif;
              text-align: center;
              pointer-events: none;
            }
            @media (orientation: portrait) and (pointer: coarse) {
              #ratlla-rotate { display: block; }
            }
          </style>
          """
          assert '</head>' in html and '</body>' in html
          html = html.replace('</head>', responsive + '\n</head>', 1)
          html = html.replace('</body>', '<div id="ratlla-rotate">Gira el mòbil en horitzontal per jugar amb una pantalla més gran.</div>\n</body>', 1)
          path.write_text(html, encoding="utf-8")
          PY
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ runner.temp }}/ratlla/build/web
